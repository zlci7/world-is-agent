syntax = "proto3";

package gameagent.protocol.v1alpha2;

import "google/protobuf/struct.proto";

option csharp_namespace = "GameAgent.Protocol.V1Alpha2";
option go_package = "gameagent/protocol/gen/go/gameagent/protocol/v1alpha2;protocolv1alpha2";

service GameAgentGateway {
  rpc Connect(stream AdapterMessage) returns (stream RuntimeMessage);
}

message AdapterHello {
  string adapter_id = 1;
  string adapter_version = 2;
  string protocol_version = 3;
  string game_id = 4;
  string game_version = 5;
  string session_id = 6;
  repeated string supported_extensions = 7;
}

message EnvironmentReady {
  string session_id = 1;
  int64 server_time_unix_ms = 2;
  repeated string accepted_extensions = 3;
}

message EntityRef {
  string entity_id = 1;
  string entity_type = 2;
  string display_name = 3;
  string definition_id = 4;
}

message GameTime {
  optional int32 year = 1;
  optional int32 season = 2;
  optional int32 day = 3;
  optional int32 hour = 4;
  optional int32 minute = 5;
  optional int64 tick = 6;
}

message ContextFact {
  string kind = 1;
  string actor_entity_id = 2;
  string target_entity_id = 3;
  string scope_id = 4;
  string text = 5;
  string label = 6;
  google.protobuf.Struct attributes = 7;
}

message TaskScope {
  string game_id = 1;
  string world_id = 2;
  string world_run_id = 3;
  uint64 execution_generation = 4;
}

message WorldClock {
  string clock_id = 1;
  int64 now_tick = 2;
  uint64 sequence = 3;
}

message TaskCheckpointRef {
  uint32 schema_version = 1;
  string game_id = 2;
  string world_id = 3;
  string status = 4;
  string checkpoint_id = 5;
  string checksum = 6;
  string reason = 7;
}

message WorldBinding {
  TaskScope scope = 1;
  WorldClock clock = 2;
  repeated EntityRef entities = 3;
  TaskCheckpointRef checkpoint = 4;
}

message WorldBindingReady {
  TaskScope scope = 1;
  string status = 2;
  Error error = 3;
}

message WorldClockUpdate {
  TaskScope scope = 1;
  WorldClock clock = 2;
}

message TaskProposal {
  WorldClock clock = 1;
  int64 wake_at = 2;
  int64 deadline_at = 3;
  repeated string participant_entity_ids = 4;
  string equivalence_key = 5;
  google.protobuf.Struct payload = 6;
}

message TaskEvidence {
  string fact_id = 1;
  string task_id = 2;
  string operation_id = 3;
  TaskScope scope = 4;
  uint64 start_revision = 5;
  int64 occurred_at = 6;
  string outcome = 7;
  optional int64 wait_until = 8;
  google.protobuf.Struct details = 9;
  GameTime game_time = 10;
  repeated ContextFact context_facts = 11;
}

message TaskActionSource {
  string task_id = 1;
  uint64 start_revision = 2;
  string wake_id = 3;
  string operation_id = 4;
  TaskScope scope = 5;
  TaskProposal task_contract = 6;
}

message InteractionSource {
  string source_id = 1;
  TaskScope scope = 2;
  string player_entity_id = 3;
  string task_id = 4;
  string operation_id = 5;
  string kind = 6;
}

message TaskControlRequest {
  TaskScope scope = 1;
  string task_id = 2;
  string operation_id = 3;
  string request_id = 4;
  string reason = 5;
}

message TaskControlResult {
  TaskScope scope = 1;
  string task_id = 2;
  string operation_id = 3;
  string request_id = 4;
  string status = 5;
  Error error = 6;
}

message CheckpointPrepare {
  TaskScope scope = 1;
  WorldClock clock = 2;
  string save_request_id = 3;
  repeated TaskEvidence final_evidence = 4;
}

message CheckpointPrepared {
  TaskScope scope = 1;
  string save_request_id = 2;
  TaskCheckpointRef checkpoint = 3;
  Error error = 4;
}

message CheckpointFinish {
  TaskScope scope = 1;
  string save_request_id = 2;
  bool saved = 3;
}

message GameEvent {
  string event_id = 1;
  string event_type = 2;
  repeated EntityRef entities = 3;
  GameTime game_time = 4;
  google.protobuf.Struct payload = 5;
  uint64 sequence = 6;
  string world_id = 7;
  string target_entity_id = 8;
  repeated ContextFact context_facts = 9;
  repeated TaskEvidence task_evidence = 10;
  InteractionSource interaction_source = 11;
}

enum EventAckStatus {
  EVENT_ACK_STATUS_UNSPECIFIED = 0;
  EVENT_ACK_STATUS_ACCEPTED = 1;
  EVENT_ACK_STATUS_DUPLICATE = 2;
  EVENT_ACK_STATUS_REJECTED = 3;
}

message EventAck {
  string event_id = 1;
  EventAckStatus status = 2;
  Error error = 3;
}

message ObserveRequest {
  string entity_id = 1;
  string world_id = 2;
}

message Observation {
  string entity_id = 1;
  uint64 revision = 2;
  GameTime game_time = 3;
  google.protobuf.Struct state = 4;
  repeated EntityRef nearby_entities = 5;
  google.protobuf.Struct extensions = 6;
  string world_id = 7;
  repeated TaskEvidence task_evidence = 8;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_SYNC = 1;
  EXECUTION_MODE_ASYNC = 2;
}

enum CapabilityConcurrencyMode {
  CAPABILITY_CONCURRENCY_MODE_UNSPECIFIED = 0;
  CAPABILITY_CONCURRENCY_MODE_SEQUENTIAL = 1;
  CAPABILITY_CONCURRENCY_MODE_PARALLEL_SAFE = 2;
}

message Capability {
  string name = 1;
  string version = 2;
  string description = 3;
  string input_schema_json = 4;
  ExecutionMode execution_mode = 5;
  google.protobuf.Struct extensions = 6;
  CapabilityConcurrencyMode concurrency_mode = 7;
}

message CapabilityRequest {
  optional string entity_id = 1;
}

message CapabilityList {
  optional string entity_id = 1;
  repeated Capability capabilities = 2;
  uint64 revision = 3;
}

message ActionRequest {
  string action_id = 1;
  string entity_id = 2;
  string capability = 3;
  google.protobuf.Struct arguments = 4;
  google.protobuf.Struct extensions = 5;
  string world_id = 6;
  string source_event_id = 7;
  string source_turn_id = 8;
  TaskActionSource task_source = 9;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_PENDING = 1;
  ACTION_STATUS_ACCEPTED = 2;
  ACTION_STATUS_RUNNING = 3;
  ACTION_STATUS_SUCCEEDED = 4;
  ACTION_STATUS_FAILED = 5;
  ACTION_STATUS_INTERRUPTED = 6;
  ACTION_STATUS_CANCELLED = 7;
  ACTION_STATUS_REJECTED = 8;
}

message ActionStatusUpdate {
  string action_id = 1;
  ActionStatus status = 2;
  google.protobuf.Struct metadata = 3;
}

message ActionResult {
  string action_id = 1;
  ActionStatus status = 2;
  google.protobuf.Struct output = 3;
  Error error = 4;
  TaskProposal task_proposal = 5;
  repeated TaskEvidence task_evidence = 6;
}

message CancelActionRequest {
  string action_id = 1;
  string reason = 2;
}

enum TurnCompletionStatus {
  TURN_COMPLETION_STATUS_UNSPECIFIED = 0;
  TURN_COMPLETION_STATUS_COMPLETED = 1;
  TURN_COMPLETION_STATUS_FAILED = 2;
  TURN_COMPLETION_STATUS_CANCELLED = 3;
}

message TurnCompletion {
  string turn_id = 1;
  string event_id = 2;
  string world_id = 3;
  string entity_id = 4;
  TurnCompletionStatus status = 5;
  Error error = 6;
}

message Error {
  string code = 1;
  string message = 2;
  google.protobuf.Struct details = 3;
}

message Heartbeat {
  int64 timestamp_unix_ms = 1;
  uint64 last_event_sequence = 2;
}

message AdapterMessage {
  string message_id = 1;
  string correlation_id = 2;

  oneof payload {
    AdapterHello hello = 10;
    GameEvent event = 11;
    Observation observation = 12;
    CapabilityList capabilities = 13;
    ActionStatusUpdate action_status = 14;
    ActionResult action_result = 15;
    Heartbeat heartbeat = 16;
    Error error = 17;
    WorldBinding world_binding = 18;
    WorldClockUpdate world_clock = 19;
    CheckpointPrepare checkpoint_prepare = 20;
    CheckpointFinish checkpoint_finish = 21;
    TaskControlResult task_control_result = 22;
  }
}

message RuntimeMessage {
  string message_id = 1;
  string correlation_id = 2;

  oneof payload {
    EnvironmentReady environment_ready = 10;
    ObserveRequest observe = 11;
    CapabilityRequest capability_request = 12;
    ActionRequest action = 13;
    CancelActionRequest cancel_action = 14;
    EventAck event_ack = 15;
    Error error = 16;
    TurnCompletion turn_completion = 17;
    WorldBindingReady world_binding_ready = 18;
    CheckpointPrepared checkpoint_prepared = 19;
    TaskControlRequest task_control = 20;
  }
}
